# Template for ~/.pi/agent/config.yml
# install.sh substitutes @HOME@ with your home directory.

defaultProvider: openrouter
defaultModel: nvidia/nemotron-3-ultra-550b-a55b:free

extensions:
  - @HOME@/.pi/agent/extensions/load-env.ts
  - @HOME@/.pi/agent/extensions/live-status.ts
  - @HOME@/.pi/agent/extensions/xot.ts
  - @HOME@/.pi/agent/extensions/auto-rotate.ts
  - @HOME@/.pi/agent/extensions/model-rotation.ts
  - @HOME@/.pi/agent/extensions/retry-guard.ts
  - @HOME@/.pi/agent/extensions/xot-queue.ts
  - @HOME@/.pi/agent/extensions/xot-router.ts

tools:
  - read
  - write
  - edit
  - bash
